[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qagent"
version = "0.1.0"
description = "Sistema multiagente que genera y valida pruebas pytest para código Python 3.10+"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywebview>=5.0.0",
    "docker>=7.1.0",
    "jsonschema>=4.18",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
qagent = "qagent.app.desktop:main"

# Producto, comando y paquete se llaman igual: QAgent / `qagent` (antes `pyagent`).
[tool.setuptools.packages.find]
where = ["src"]
# Solo carpetas con __init__.py son paquetes: frontend/ y contracts/ejemplos/ son datos.
namespaces = false

# Recursos que la app necesita instalada (TA-06): sin ellos `pip install qagent` abre sin interfaz.
[tool.setuptools.package-data]
"qagent" = ["frontend/**/*"]
"qagent.config" = ["config.toml", "config.local.ejemplo.toml"]
"qagent.contracts" = ["*.schema.json", "ejemplos/*.json"]
"qagent.sandbox" = ["Dockerfile"]
"qagent.llm" = ["proveedores.toml", "ia_simulada.json"]

[tool.pytest.ini_options]
# src/ para importar `qagent`; la raíz para importar helpers de las pruebas (`tests.orchestrator.fakes`).
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    'docker: prueba de integración que necesita Docker Desktop iniciado (omitir con -m "not docker")',
    'red: prueba de integración que necesita internet (omitir con -m "not red")',
]

[tool.ruff]
# bench/ y bench_api/ son bancos con bugs sembrados a propósito: no se reformatea ni se "arregla".
extend-exclude = ["bench", "bench_api"]
