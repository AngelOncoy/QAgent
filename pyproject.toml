[build-system]
requires = ["setuptools>=77"]  # 77+: licencia como expresión SPDX (license = "MIT")
build-backend = "setuptools.build_meta"

[project]
# Nombre en PyPI (`pip install qagent-pytest`): «qagent» ya era de otro proyecto. El
# producto, el comando `qagent` y el paquete `import qagent` no cambian (ADR-005).
name = "qagent-pytest"
version = "0.2.0"
description = "Sistema multiagente que genera y valida pruebas pytest para código Python 3.10+"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Equipo QAgent - Taller Integrador I (UPAO)" }]
keywords = ["pytest", "testing", "unit tests", "llm", "multi-agent", "test generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pywebview>=5.0.0",
    "docker>=7.1.0",
    "requests>=2.31",  # se usa directamente en sandbox/ejecucion.py
    "jsonschema>=4.18",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "build>=1.2",  # scripts/verificar_paquete.py construye el wheel y el sdist
]
# Solo para construir el ejecutable de Windows (scripts/construir_windows.py).
empaquetar = [
    "pyinstaller>=6.10",
]

[project.urls]
Repositorio = "https://github.com/AngelOncoy/QAgent"
Problemas = "https://github.com/AngelOncoy/QAgent/issues"

[project.scripts]
qagent = "qagent.app.desktop:ejecutar"

# Producto, comando y paquete se llaman igual: QAgent / `qagent` (antes `pyagent`).
[tool.setuptools.packages.find]
where = ["src"]
# Se descubren también las carpetas sin __init__.py (frontend/, contracts/ejemplos/):
# así setuptools no avisa de paquetes «ambiguos» y sus archivos se instalan.

# Recursos que la app necesita instalada (TA-06): sin ellos `pip install qagent` abre sin interfaz.
[tool.setuptools.package-data]
"qagent.frontend" = ["**/*"]
"qagent.config" = ["config.toml", "config.local.ejemplo.toml"]
"qagent.contracts" = ["*.schema.json", "ejemplos/*.json"]
"qagent.sandbox" = ["Dockerfile"]
"qagent.llm" = ["proveedores.toml", "ia_simulada.json"]

[tool.pytest.ini_options]
# src/ para importar `qagent`; la raíz para importar helpers de las pruebas (`tests.orchestrator.fakes`).
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    'docker: prueba de integración que necesita Docker Desktop iniciado (omitir con -m "not docker")',
    'red: prueba de integración que necesita internet (omitir con -m "not red")',
]

[tool.ruff]
# bench/ y bench_api/ son bancos con bugs sembrados a propósito: no se reformatea ni se "arregla".
extend-exclude = ["bench", "bench_api"]
