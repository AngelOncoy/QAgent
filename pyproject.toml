[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagent"
version = "0.1.0"
description = "Sistema multiagente que genera y valida pruebas unitarias pytest para código Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pywebview"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pyagent = "pyagent.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyagent.app" = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/Demo"]
