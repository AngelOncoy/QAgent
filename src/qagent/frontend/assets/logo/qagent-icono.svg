<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 245" fill="none" role="img" aria-label="QAgent">
  <defs>
    <linearGradient id="qa-marca" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="170" y2="245">
      <stop offset="0" stop-color="#e6b8f2"/>
      <stop offset="0.5" stop-color="#9d8cf7"/>
      <stop offset="1" stop-color="#3f63ff"/>
    </linearGradient>
    <radialGradient id="qa-brillo">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#b79cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#qa-marca)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- hexágono exterior -->
    <path d="M120 12 L25 67 V177 L120 232 L215 177 V67 Z"/>
    <!-- hexágono medio, con huecos laterales -->
    <path d="M59 112 V87 L120 52 L181 87 V112"/>
    <path d="M59 132 V157 L120 192 L181 157 V132"/>
    <!-- hexágono interior, con huecos laterales -->
    <path d="M84 113 V101 L120 80 L156 101 V113"/>
    <path d="M84 131 V143 L120 164 L156 143 V131"/>
    <!-- conexiones entre anillos -->
    <path d="M25 67 L120 50 M215 177 L120 196 M120 12 V50 M120 196 V232"/>
  </g>

  <!-- nodos -->
  <g fill="#0a0524" stroke="url(#qa-marca)" stroke-width="3.5">
    <circle cx="120" cy="12" r="7.5"/>
    <circle cx="25" cy="67" r="7.5"/>
    <circle cx="121" cy="50" r="7.5"/>
    <circle cx="215" cy="67" r="7.5"/>
    <circle cx="25" cy="177" r="7.5"/>
    <circle cx="217" cy="177" r="7.5"/>
    <circle cx="120" cy="196" r="7.5"/>
    <circle cx="120" cy="232" r="7.5"/>
  </g>

  <!-- núcleo: brillo y letra Q -->
  <circle cx="120" cy="122" r="34" fill="url(#qa-brillo)"/>
  <g stroke="#ffffff" stroke-width="5.5" stroke-linecap="round">
    <circle cx="118" cy="119" r="12.5"/>
    <path d="M123 124 L132 135"/>
  </g>
</svg>
