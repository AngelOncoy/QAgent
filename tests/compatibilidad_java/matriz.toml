# Matriz de compatibilidad Java con proyectos externos (#309).
#
# Cada fila fija QUÉ se comprueba y QUÉ se espera antes de ejecutarla:
# - `externo`: proyecto público con URL, licencia y commit inmutable (nunca una rama).
# - `fixture`: un fixture del repositorio y la prueba `docker` que ya lo ejecuta.
# - `soporte`: `declarado` (QAgent dice soportarlo: debe aprobar) o `no_admitido`
#   (escenario fuera del alcance aprobado: debe omitirse o bloquearse con su motivo).
# - `nivel`: `pr` entra en la comprobación de cada PR (presupuesto de tiempo acotado);
#   `ampliada` solo corre a mano o cada lunes. `pr` también corre en la ampliada.
#
# Los esperados de los casos salen del Javadoc del commit fijado o, si el método no
# tiene Javadoc, de la lectura estática de su cuerpo (origen `inferido`, ADR-018).
# Nunca de ejecutar el proyecto. El ejecutor está en `ejecutar.py` y el comando en
# `scripts/matriz_java.py`; la guía en `docs/java/matriz-compatibilidad.md`.

version = 1

# --- Externos ---------------------------------------------------------------------

[[fila]]
id = "gs-maven"
tipo = "externo"
nivel = "pr"
soporte = "declarado"
configuraciones = ["maven_simple", "inferencia"]
descripcion = "Proyecto Maven de un módulo sin padre, con JUnit 4 propio y fuentes Java 8; método sin Javadoc."
url = "https://github.com/spring-guides/gs-maven"
licencia = "Apache-2.0"
archivo_licencia = "LICENSE.txt"
commit = "c65883f80b35bac86bb2580944de9146e2c6a55a"
subdirectorio = "complete"
perfil = "std"
inferir = true

[[fila.objetivo]]
modulo = "src/main/java/hello/Greeter.java"
objetivo = "Greeter.sayHello"
tipo = "funcion"
esperado = "aprobado"
imports = ["static org.junit.jupiter.api.Assertions.assertEquals"]

[[fila.objetivo.caso]]
id = "saludo_normal"
entrada = {}
valor_esperado = "Hello world!"
origen = "inferido"
evidencia = ["cuerpo"]
categoria = "normal"
junit = 'assertEquals("Hello world!", new Greeter().sayHello());'

[[fila]]
id = "gs-maven-defecto"
tipo = "externo"
nivel = "pr"
soporte = "declarado"
configuraciones = ["maven_simple", "inferencia", "defecto_sembrado"]
descripcion = "Mismo commit que gs-maven con un defecto sembrado: un fallo inferido es un hallazgo a revisar, no un bug confirmado."
base = "gs-maven"
defecto_sembrado = true

[[fila.parche]]
archivo = "src/main/java/hello/Greeter.java"
buscar = 'return "Hello world!";'
reemplazar = 'return "Hello World";'

[[fila.objetivo]]
modulo = "src/main/java/hello/Greeter.java"
objetivo = "Greeter.sayHello"
tipo = "funcion"
esperado = "hallazgo_inferido"

