# Publica QAgent en PyPI como `qagent-pytest` (TA-06).
#
# - Al publicar una Release en GitHub (etiqueta vX.Y.Z = version de pyproject.toml):
#   verifica el paquete, lo construye y lo sube a PyPI.
# - A mano (Actions > Publicar en PyPI > Run workflow): elige TestPyPI para practicar.
#
# Sin contraseñas ni tokens: usa Trusted Publishing. Se configura una vez en pypi.org y
# test.pypi.org (ver docs/decisiones/ADR-005-distribucion.md).
name: Publicar en PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      destino:
        description: "Dónde publicar"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  construir:
    name: Verificar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: La etiqueta de la Release coincide con la versión
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $VERSION de pyproject.toml"
            exit 1
          fi
      - name: Herramientas
        run: python -m pip install build twine
      - name: El paquete funciona instalado fuera del repositorio
        run: python scripts/verificar_paquete.py
      - name: Construir wheel y sdist
        run: python -m build
      - name: Revisar que PyPI acepte el paquete
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distribucion
          path: dist/

  testpypi:
    name: Publicar en TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.destino == 'testpypi'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qagent-pytest
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribucion
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publicar en PyPI
    if: github.event_name == 'release' || inputs.destino == 'pypi'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qagent-pytest
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribucion
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
