# Corre las pruebas con Docker real (marcador `docker`) en un runner efímero (#250).
#
# Esas pruebas no corren con `python test.py` (tardan unos 15 minutos y construyen cerca
# de 10 GB de imágenes), así que este workflow las vigila sin gastar el disco de nadie:
# - A mano: Actions > Pruebas con Docker real > Run workflow (elige la rama).
# - Cada lunes sobre `develop`.
# El runner se descarta al terminar: no hace falta borrar las imágenes.
name: Pruebas con Docker real

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"  # lunes, 09:00 UTC

permissions:
  contents: read

jobs:
  docker:
    name: pytest --docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.17"
      - name: Dependencias
        run: python -m pip install -e ".[dev]"
      - name: Docker
        run: docker version
      - name: Pruebas con Docker real
        run: python test.py --sin-lint --docker --conservar-imagenes -m docker -rs
